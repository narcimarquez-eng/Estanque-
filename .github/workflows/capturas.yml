name: Capturas del estanque

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright y Chromium
        run: |
          npm install --prefix .capturas playwright --no-audit --no-fund
          .capturas/node_modules/.bin/playwright install --with-deps chromium

      - name: Sacar capturas
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > servidor.log 2>&1 &
          sleep 2
          node tools/capturas.mjs

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-estanque
          path: capturas/
          if-no-files-found: warn
