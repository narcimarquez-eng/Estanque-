<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Estanque Koi de Otoño</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: system-ui, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; }
  .panel {
    position: fixed; background: rgba(0, 0, 0, .45); color: #fff;
    border-radius: 10px; font-size: 13px; line-height: 1.5;
  }
  #legend { top: 10px; left: 10px; padding: 8px 10px; max-width: 250px; }
  #times { bottom: 14px; right: 12px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  #times button, #pad button {
    border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .22);
    color: #fff; font: inherit; border-radius: 8px; cursor: pointer;
  }
  #times button { padding: 7px 10px; }
  #times button.on { background: rgba(255, 255, 255, .7); color: #111; }
  #pad {
    position: fixed; bottom: 14px; left: 12px; display: none;
    grid-template-columns: repeat(4, 54px); grid-template-rows: repeat(2, 54px); gap: 6px;
  }
  #pad button { font-size: 20px; padding: 0; }
  @media (pointer: coarse) { #pad { display: grid; } }
</style>
</head>
<body>

<div id="legend" class="panel">
  <b>Estanque koi de otoño</b><br>
  Arrastra para mirar · WASD o flechas para moverte · Espacio sube, Mayús baja<br>
  1-4: mañana, tarde, hora dorada, hora azul<br>
  C: cambiar de cámara<br>
  <span style="opacity:.7">En móvil: arrastra con un dedo y usa las flechas y ↑ ↓ de abajo.</span>
</div>

<div id="times" class="panel">
  <button data-time="1">Mañana</button>
  <button data-time="2">Tarde</button>
  <button data-time="3">Dorada</button>
  <button data-time="4">Azul</button>
  <button data-cam="1">Cámara (C)</button>
</div>

<div id="pad">
  <button data-key="KeyW" style="grid-column:2; grid-row:1">▲</button>
  <button data-key="KeyA" style="grid-column:1; grid-row:2">◀</button>
  <button data-key="KeyS" style="grid-column:2; grid-row:2">▼</button>
  <button data-key="KeyD" style="grid-column:3; grid-row:2">▶</button>
  <button data-key="Space" title="Subir la cámara" style="grid-column:4; grid-row:1">↑</button>
  <button data-key="ShiftLeft" title="Bajar la cámara" style="grid-column:4; grid-row:2">↓</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
   0. UTILIDADES Y CALIDAD
   ========================================================= */
// En móvil (puntero táctil) se reduce la calidad para que vaya fluido.
const LOW = window.matchMedia('(pointer: coarse)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const mk = (geo, mat, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
};
const hexToRGB = (s) => {
  const v = parseInt(s.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
};

/* =========================================================
   1. FORMAS DE HOJA DE ARCE (geometría 3D con pliegue)
   ========================================================= */
const D2R = Math.PI / 180;
const TIP_DEG = [306, 378, 450, 522, 594];    // puntas de los 5 lóbulos
const NOTCH_DEG = [342, 414, 486, 558, 630];  // entrantes entre lóbulos
const polar = (deg, r) => [Math.cos(deg * D2R) * r, Math.sin(deg * D2R) * r];

// Contorno de la hoja (coordenadas de -1 a 1), sirve para dibujar la textura.
function traceLeaf(t) {
  t.moveTo(...polar(270, 0.12));
  for (let i = 0; i < 5; i++) {
    const prev = i === 0 ? 270 : NOTCH_DEG[i - 1];
    const tip = TIP_DEG[i], notch = NOTCH_DEG[i];
    const c1 = polar((prev + tip) / 2, 0.8), p1 = polar(tip, 0.95);
    t.quadraticCurveTo(c1[0], c1[1], p1[0], p1[1]);
    const c2 = polar((tip + notch) / 2, 0.8);
    const p2 = polar(notch, i === 4 ? 0.12 : 0.42);
    t.quadraticCurveTo(c2[0], c2[1], p2[0], p2[1]);
  }
}

// Una hoja es un plano con muchas divisiones, doblado por la nervadura central
// y con los bordes caídos. La silueta la recorta la textura (transparencia).
function leafGeometry(seg = 8) {
  const g = new THREE.PlaneGeometry(1, 1, seg, seg);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    p.setZ(i, -Math.abs(x) * 0.5 - y * y * 0.3 + Math.sin(y * 9 + x * 4) * 0.02);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

/* =========================================================
   2. TEXTURAS PROCEDURALES (dibujadas en código, sin descargas)
   ========================================================= */
function hash(x, y, seed) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
// Ruido de valor periódico: se repite sin costuras.
function vnoise(x, y, p, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = ((xi % p) + p) % p, x1 = (((xi + 1) % p) + p) % p;
  const y0 = ((yi % p) + p) % p, y1 = (((yi + 1) % p) + p) % p;
  const a = hash(x0, y0, seed), b = hash(x1, y0, seed);
  const c = hash(x0, y1, seed), d = hash(x1, y1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, p, oct, seed = 1) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let o = 0; o < oct; o++) {
    s += amp * vnoise(x * f, y * f, p * f, seed + o);
    norm += amp;
    amp *= 0.5;
    f *= 2;
  }
  return s / norm;
}
function canvasTex(canvas, srgb = true, repeat = 1) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = 4;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Textura de color con ruido entre dos colores (suelo, piedra, corteza...).
function noiseCanvas(size, p, colA, colB, oct = 5, seed = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size), d = img.data;
  const A = hexToRGB(colA), B = hexToRGB(colB);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const n = fbm(x / size * p, y / size * p, p, oct, seed);
      const m = Math.min(1, Math.max(0, (n - 0.25) * 2));
      const i = (y * size + x) * 4;
      for (let k = 0; k < 3; k++) d[i + k] = A[k] + (B[k] - A[k]) * m;
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
// Mapa de normales a partir de ruido (ondas del agua).
function normalCanvas(size, p, strength, seed = 7) {
  const h = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) h[y * size + x] = fbm(x / size * p, y / size * p, p, 4, seed);
  }
  const at = (x, y) => h[((y + size) % size) * size + ((x + size) % size)];
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size), d = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = (at(x - 1, y) - at(x + 1, y)) * strength;
      const ny = (at(x, y + 1) - at(x, y - 1)) * strength;
      const l = Math.hypot(nx, ny, 1);
      const i = (y * size + x) * 4;
      d[i] = (nx / l * 0.5 + 0.5) * 255;
      d[i + 1] = (ny / l * 0.5 + 0.5) * 255;
      d[i + 2] = (1 / l * 0.5 + 0.5) * 255;
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
// Hoja de arce: color que oscurece hacia el borde, venas, manchas de otoño.
function leafCanvas() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.setTransform(128, 0, 0, -128, 128, 128); // coordenadas de -1 a 1 (y hacia arriba)
  const grad = g.createRadialGradient(0, 0, 0.05, 0, 0, 1);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#b4b4b4');
  g.fillStyle = grad;
  g.beginPath();
  traceLeaf(g);
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(70, 35, 15, 0.5)';
  g.lineWidth = 0.022;
  g.beginPath(); g.moveTo(0, -0.8); g.lineTo(0, 0.9); g.stroke();
  g.lineWidth = 0.011;
  g.beginPath();
  for (const d of TIP_DEG) {
    const [tx, ty] = polar(d, 0.8);
    g.moveTo(0, 0.05);
    g.lineTo(tx, ty);
  }
  g.stroke();
  for (let i = 0; i < 40; i++) {
    const a = rnd(0, Math.PI * 2), r = rnd(0.45, 0.9);
    g.fillStyle = `rgba(90, 40, 10, ${rnd(0.1, 0.4).toFixed(2)})`;
    g.beginPath();
    g.arc(Math.cos(a) * r, Math.sin(a) * r, rnd(0.02, 0.07), 0, Math.PI * 2);
    g.fill();
  }
  return c;
}
// Brizna de hierba: más oscura en la base y más clara en la punta.
function bladeCanvas() {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 128, 0, 0);
  grad.addColorStop(0, '#6a7f2e');
  grad.addColorStop(0.6, '#a9c25a');
  grad.addColorStop(1, '#d6df86');
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(3, 128);
  g.quadraticCurveTo(10, 60, 16, 0);
  g.quadraticCurveTo(22, 60, 29, 128);
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(40, 60, 20, 0.35)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(16, 126); g.quadraticCurveTo(15, 60, 16, 4); g.stroke();
  return c;
}
// Tejas curvas para el tejado de la casa de té.
function tileCanvas() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#3a3640';
  g.fillRect(0, 0, 128, 128);
  for (let row = 0; row < 8; row++) {
    const off = (row % 2) * 16;
    for (let x = -16; x < 144; x += 32) {
      const r = Math.round(rnd(60, 90)), gg = Math.round(rnd(60, 80)), b = Math.round(rnd(70, 100));
      g.fillStyle = `rgb(${r}, ${gg}, ${b})`;
      g.beginPath();
      g.arc(x + off, row * 16 + 16, 16, Math.PI, 0);
      g.fill();
      g.strokeStyle = 'rgba(0, 0, 0, 0.5)';
      g.lineWidth = 2;
      g.stroke();
    }
  }
  return c;
}
// Dibujo de koi: fondo blanco, naranja o dorado con manchas.
function koiCanvas(base, spots) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 12; i++) {
    g.fillStyle = spots[i % spots.length];
    g.beginPath();
    g.ellipse(rnd(0, 256), rnd(16, 112), rnd(12, 34), rnd(8, 22), rnd(0, 3), 0, Math.PI * 2);
    g.fill();
  }
  return c;
}

// Coordenadas de textura según la posición en el mundo (la grava no se estira a lo largo de las cintas)
function uvMundo(geo, escala) {
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) * escala, p.getZ(i) * escala);
  uv.needsUpdate = true;
  return geo;
}

   3. RENDERER, ESCENA, CÁMARA Y POSTPROCESO
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Niebla de aire: crece con la distancia y funde el suelo con el horizonte.
scene.fog = new THREE.Fog(0xc6dce8, 18, 170);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.rotation.order = 'YXZ';

// Cielo físico: cambia de color según la posición del sol.
const sky = new Sky();
sky.scale.setScalar(1000);
scene.add(sky);

// Segundo cielo, solo para generar los reflejos del entorno.
const envScene = new THREE.Scene();
const envSky = new Sky();
envSky.scale.setScalar(1000);
envScene.add(envSky);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function updateEnvironment() {
  const target = pmrem.fromScene(envScene, 0, 0.1, 2000);
  if (envRT) envRT.dispose();
  envRT = target;
  scene.environment = target.texture;
}

// Postproceso: anti-aliasing, desenfoque de fondo (PC), brillo de faroles (PC) y tono final.
const renderTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: LOW ? 0 : 4 });
const composer = new EffectComposer(renderer, renderTarget);
composer.addPass(new RenderPass(scene, camera));
let bokeh = null;
if (!LOW) {
  bokeh = new BokehPass(scene, camera, { focus: 8, aperture: 0.02, maxblur: 0.004 });
  composer.addPass(bokeh);
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.25, 0.4, 0.92));
}
composer.addPass(new OutputPass());

const sunDir = new THREE.Vector3();
// elev: altura del sol en grados (negativo = bajo el horizonte)
// az: acimut en grados (180 = detrás del puente, visto desde la cámara)
const TIMES = {
  1: { label: 'Mañana',      elev: 16, az: 70,  sunI: 2.8, sunColor: 0xffe6c4, turb: 4, ray: 1.0, hemi: 0xbfd8ff, hemiI: 0.35, fog: 0xd7e3ea },
  2: { label: 'Tarde',       elev: 48, az: 25,  sunI: 3.0, sunColor: 0xfff4e6, turb: 5, ray: 1.0, hemi: 0xcfe4ff, hemiI: 0.4,  fog: 0xc6dce8 },
  3: { label: 'Hora dorada', elev: 7,  az: 200, sunI: 3.2, sunColor: 0xffa452, turb: 8, ray: 2.2, hemi: 0xffc89a, hemiI: 0.35, fog: 0xe9a874 },
  4: { label: 'Hora azul',   elev: -4, az: 230, sunI: 0.0, sunColor: 0x8fa6dd, turb: 3, ray: 0.7, hemi: 0x6f88c0, hemiI: 0.7,  fog: 0x2f3f66 },
};
function setSunDir(elev, az) {
  const e = THREE.MathUtils.degToRad(elev), a = THREE.MathUtils.degToRad(az);
  sunDir.set(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a));
}

const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x4a5a3a, 0.4);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(hemi, sun, sun.target);

let timeKey = 2;
function refreshButtons() {
  document.querySelectorAll('[data-time]').forEach((b) =>
    b.classList.toggle('on', Number(b.dataset.time) === timeKey));
}
function applySky(u, t) {
  u.sunPosition.value.copy(sunDir);
  u.turbidity.value = t.turb;
  u.rayleigh.value = t.ray;
}
function setTime(k) {
  timeKey = k;
  const t = TIMES[k];
  setSunDir(t.elev, t.az);
  sun.position.copy(sunDir).multiplyScalar(40);
  sun.color.setHex(t.sunColor);
  sun.intensity = t.sunI;
  hemi.color.setHex(t.hemi);
  hemi.intensity = t.hemiI;
  applySky(sky.material.uniforms, t);
  applySky(envSky.material.uniforms, t);
  scene.fog.color.setHex(t.fog);
  if (water.material.uniforms.sunDirection) water.material.uniforms.sunDirection.value.copy(sunDir);
  if (water.material.uniforms.sunColor) water.material.uniforms.sunColor.value.setHex(t.sunColor);
  if (waterV.material.uniforms.sunDirection) waterV.material.uniforms.sunDirection.value.copy(sunDir);
  if (waterV.material.uniforms.sunColor) waterV.material.uniforms.sunColor.value.setHex(t.sunColor);
  updateEnvironment();
  refreshButtons();
}

const CANOPY_COLS = [0xd9552b, 0xe8a33d, 0xb8402a, 0xc9832a, 0xe0703a, 0xf0c040];

// Árbol con ramas de verdad: el tronco se divide en ramas más finas y las hojas
// cuelgan de las puntas. Devuelve la madera y las hojas como dos geometrías.
function branchingTree({ depth, kids = 2, trunkLen, trunkRad, leavesPer, stems = 1 }) {
  const bark = [], leafParts = [];
  const up = new THREE.Vector3(0, 1, 0);
  const ONE = new THREE.Vector3(1, 1, 1);
  const q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  const m = new THREE.Matrix4();

  function limb(pos, dir, len, rad, d) {
    // cilindro orientado a lo largo de la rama
    const geo = new THREE.CylinderGeometry(rad * 0.65, rad, len, 5, 1);
    q.setFromUnitVectors(up, dir);
    p.copy(pos).addScaledVector(dir, len / 2);
    m.compose(p, q, ONE);
    geo.applyMatrix4(m);
    bark.push(geo);

    const end = pos.clone().addScaledVector(dir, len);
    if (d === 0) {
      // hojas agrupadas en la punta de la ramita
      for (let i = 0; i < leavesPer; i++) {
        const lg = LEAF_GEO_LOW.clone();
        p.copy(end).add(new THREE.Vector3(rnd(-0.5, 0.5), rnd(-0.3, 0.5), rnd(-0.5, 0.5)));
        q.setFromEuler(new THREE.Euler(rnd(0, Math.PI * 2), rnd(0, Math.PI * 2), rnd(0, Math.PI * 2)));
        sc.setScalar(rnd(0.35, 0.6));
        m.compose(p, q, sc);
        lg.applyMatrix4(m);
        leafParts.push(lg);
      }
      return;
    }
    for (let k = 0; k < kids; k++) {
      const nd = dir.clone()
        .add(new THREE.Vector3(rnd(-0.6, 0.6), rnd(-0.1, 0.4), rnd(-0.6, 0.6)))
        .normalize();
      limb(end, nd, len * rnd(0.6, 0.75), rad * 0.62, d - 1);
    }
  }

  const origin = new THREE.Vector3();
  for (let s = 0; s < stems; s++) {
    if (stems === 1) {
      limb(origin, up.clone(), trunkLen, trunkRad, depth);
    } else {
      const dir = new THREE.Vector3(rnd(-0.5, 0.5), 1, rnd(-0.5, 0.5)).normalize();
      limb(origin, dir, trunkLen * rnd(0.7, 1), trunkRad * 0.6, depth);
    }
  }
  return { bark: mergeGeometries(bark), leaves: mergeGeometries(leafParts) };
}

function instanceTrees(variant, count, place, shadow = false, solidR = 0) {
  const barkM = new THREE.InstancedMesh(variant.bark, mBark, count);
  const leafM = new THREE.InstancedMesh(variant.leaves, mLeaf, count);
  for (let i = 0; i < count; i++) {

    if (solidR) SOLIDS.push({ x: t.x, z: t.z, r: solidR * t.s });
    dummy.position.set(t.x, t.y || 0, t.z);
    dummy.rotation.set(0, rnd(0, Math.PI * 2), 0);
    dummy.scale.setScalar(t.s);
    dummy.updateMatrix();
    barkM.setMatrixAt(i, dummy.matrix);
    leafM.setMatrixAt(i, dummy.matrix);
    leafM.setColorAt(i, new THREE.Color(CANOPY_COLS[Math.floor(Math.random() * CANOPY_COLS.length)]));
  }
  for (const im of [barkM, leafM]) {
    im.instanceMatrix.needsUpdate = true;
    im.frustumCulled = false;
    im.castShadow = shadow;
    im.receiveShadow = true;
    scene.add(im);
  }
  leafM.instanceColor.needsUpdate = true;
}

// Mata de hierba: varias briznas por grupo, curvadas, con la base oscura (sombra de contacto).
function grassClump() {
  const parts = [];
  for (let b = 0; b < 7; b++) {
    const g = new THREE.PlaneGeometry(0.07, 0.5, 1, 4);
    g.translate(0, 0.25, 0);
    const pos = g.attributes.position;
    const col = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const t = pos.getY(i) / 0.5;
      pos.setZ(i, pos.getZ(i) + t * t * 0.12);   // la punta se dobla hacia delante
      const sh = 0.35 + 0.65 * t;                // base oscura, punta clara
      col.set([sh, sh, sh], i * 3);
    }
    pos.needsUpdate = true;
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.Matrix4().makeRotationFromEuler(
      new THREE.Euler(rnd(-0.15, 0.15), rnd(0, Math.PI * 2), rnd(-0.15, 0.15)));
    m.setPosition(rnd(-0.08, 0.08), 0, rnd(-0.08, 0.08));
    g.applyMatrix4(m);
    parts.push(g);
  }
  return mergeGeometries(parts);
}

const HW = 0.5; // medio ancho del agua
// Distancia de un punto al riachuelo (segmentos de STREAM)
function distToStream(x, z) {
  let m = 1e9;
  for (let i = 0; i < STREAM.length - 1; i++) {
    const [ax, az] = STREAM[i], dx = STREAM[i + 1][0] - ax, dz = STREAM[i + 1][1] - az;
    const t = THREE.MathUtils.clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
    m = Math.min(m, Math.hypot(x - ax - dx * t, z - az - dz * t));
  }
  return m;
}

  tail.position.z = -0.42;
  fish.add(body, tail);
  scene.add(fish);

  const R = rnd(2.4, 3.8);
  const pts = [];
  for (let j = 0; j < 8; j++) {
    const a = (j / 8) * Math.PI * 2;
    const r = R + rnd(-0.5, 0.5);
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
  return {
    mesh: fish,
    curve: new THREE.CatmullRomCurve3(pts, true),
    speed: rnd(0.02, 0.035),
    offset: Math.random(),
  };
});
function updateKoi(t) {
  for (const k of koi) {
    const u = (t * k.speed + k.offset) % 1;
    const p = k.curve.getPointAt(u);
    const tan = k.curve.getTangentAt(u);
    k.mesh.position.set(p.x, -0.1, p.z);
    k.mesh.lookAt(p.x + tan.x, -0.1, p.z + tan.z);
  }
}

/* =========================================================
   12. HOJAS QUE CAEN
   ========================================================= */
const LEAVES = LOW ? 150 : 260;
const leaves = new THREE.InstancedMesh(LEAF_GEO, mLeaf, LEAVES);
const leafCols = [0xd9552b, 0xe8a33d, 0xb8402a, 0xc9832a, 0xf0c040];
for (let i = 0; i < LEAVES; i++) leaves.setColorAt(i, new THREE.Color(leafCols[i % leafCols.length]));
leaves.frustumCulled = false;
scene.add(leaves);

function resetLeaf(s, anyHeight) {
  if (Math.random() < 0.5) { // la mitad cae sobre el riachuelo, para que las hojas se acumulen allí
    const i = Math.floor(rnd(0, STREAM.length - 1)), t = rnd(0, 1);
    s.x = STREAM[i][0] + (STREAM[i + 1][0] - STREAM[i][0]) * t + rnd(-0.4, 0.4);
    s.z = STREAM[i][1] + (STREAM[i + 1][1] - STREAM[i][1]) * t + rnd(-0.4, 0.4);
  } else {
    const a = rnd(0, Math.PI * 2), r = Math.sqrt(rnd(0, 12 * 12));
    s.x = Math.cos(a) * r;
    s.z = Math.sin(a) * r;
  }
  s.y = anyHeight ? rnd(0.3, 7) : rnd(5, 8);
  s.sp = rnd(0.25, 0.5);
  s.ph = rnd(0, Math.PI * 2);
}
const leafState = Array.from({ length: LEAVES }, () => {
  const s = {};
  resetLeaf(s, true);
  return s;
});
// Altura del terreno bajo una hoja: la loma del norte; en el resto, el suelo plano
const sueloY = (x, z) => Math.max(0, loma(x, z));

// Hojas que se posan: al tocar el agua o el suelo se quedan donde cayeron y se acumulan.
// Con esta caída, la pila se llena en unos 30 s; después se desvanece y vuelve a empezar.
const PILE_S = 30;
const PILE = Math.round(LEAVES * 1.8);
const pile = new THREE.InstancedMesh(LEAF_GEO, mLeaf, PILE);
const pileObj = new THREE.Object3D();
pileObj.rotation.order = 'YXZ';              // primero tumbada, luego girada sobre el suelo
const pileState = Array.from({ length: PILE }, () => ({ on: false, sc: 0, x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0 }));
for (let i = 0; i < PILE; i++) pile.setColorAt(i, new THREE.Color(leafCols[i % leafCols.length]));
pile.frustumCulled = false;
pile.receiveShadow = true;
scene.add(pile);
let pileNext = 0, pileT = 0;

function posarHoja(s) {
  const p = pileState[pileNext];
  pileNext = (pileNext + 1) % PILE;
  p.on = true; p.sc = 0;
  p.x = s.x; p.z = s.z;
  p.y = sueloY(s.x, s.z) + (distToStream(s.x, s.z) < HW + 0.1 ? 0.06 : 0.035);
  p.rx = -Math.PI / 2 + rnd(-0.12, 0.12); p.ry = rnd(0, Math.PI * 2); p.rz = rnd(-0.1, 0.1);
}
function updatePile(dt) {
  pileT += dt;
  if (pileT > PILE_S) { // se acabaron los 30 s: las hojas se desvanecen y empieza una pila nueva
    pileT = 0;
    pileNext = 0;
    for (const p of pileState) p.on = false;
  }
  for (let i = 0; i < PILE; i++) {
    const p = pileState[i];
    p.sc += ((p.on ? 0.22 : 0) - p.sc) * Math.min(1, dt * 2);
    pileObj.position.set(p.x, p.y, p.z);
    pileObj.rotation.set(p.rx, p.ry, p.rz);
    pileObj.scale.setScalar(Math.max(p.sc, 1e-4));
    pileObj.updateMatrix();
    pile.setMatrixAt(i, pileObj.matrix);
  }
  pile.instanceMatrix.needsUpdate = true;
}

function updateLeaves(dt, t) {
  for (let i = 0; i < LEAVES; i++) {
    const s = leafState[i];
    s.y -= s.sp * dt;
    if (s.y < sueloY(s.x, s.z) + 0.1) { posarHoja(s); resetLeaf(s, false); }
    dummy.position.set(s.x + Math.sin(t * 1.2 + s.ph) * 0.4, s.y, s.z);
    dummy.rotation.set(t * 1.5 + s.ph, t * 0.8, t * 1.1 + s.ph);
    dummy.scale.setScalar(0.22);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
  }
  leaves.instanceMatrix.needsUpdate = true;
  updatePile(dt);
}

/* =========================================================

// El agua del riachuelo, la cascada y las fuentes es el mismo shader de agua que el estanque
// (reflejos del cielo, ondas y color). Las superficies planas se juntan en una sola malla, más abajo.
const surfParts = [];
// Lecho y orillas con las mismas texturas originales del fondo del estanque y de las rocas
const mPath = new THREE.MeshStandardMaterial({ map: texRock, roughness: 0.95, side: THREE.DoubleSide });
// Piedras de río: cuatro tipos con colores y acabados distintos (canto rodado, musgo, caliza y granito)
const texCanto   = canvasTex(noiseCanvas(256, 9, '#7a7060', '#b3a88f', 4, 11), true, 1);
const texMusgo   = canvasTex(noiseCanvas(256, 7, '#4a5a2c', '#8a8a54', 5, 12), true, 1);
const texCaliza  = canvasTex(noiseCanvas(256, 5, '#a9a496', '#e2dccb', 4, 13), true, 1);
const texGranito = canvasTex(noiseCanvas(256, 10, '#5b4636', '#8c7561', 5, 14), true, 1);
const mCanto   = new THREE.MeshStandardMaterial({ map: texCanto, roughness: 0.9, vertexColors: true, flatShading: true });
const mMusgo   = new THREE.MeshStandardMaterial({ map: texMusgo, roughness: 0.9, vertexColors: true, flatShading: true });
const mCaliza  = new THREE.MeshStandardMaterial({ map: texCaliza, roughness: 0.85, vertexColors: true, flatShading: true });
const mGranito = new THREE.MeshStandardMaterial({ map: texGranito, roughness: 0.9, vertexColors: true, flatShading: true });
const mWin  = new THREE.MeshStandardMaterial({ color: 0xffe2b0, emissive: 0xffa54a, emissiveIntensity: 0.2, roughness: 0.9 });

// Cinta plana que sigue una línea (agua, lecho, orillas, caminos). pts = [[x, z], ...]
function ribbon(pts, w0, w1, y, uScale = 0.4) {
  const pos = [], uv = [], idx = [];
  let acc = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    if (i > 0) acc += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
    let dx = b[0] - a[0], dz = b[1] - a[1];
    const L = Math.hypot(dx, dz) || 1;
    dx /= L; dz /= L;
    const t = i / (pts.length - 1), h = (w0 + (w1 - w0) * t) / 2;
    const nx = -dz * h, nz = dx * h;
    pos.push(p[0] + nx, y, p[1] + nz, p[0] - nx, y, p[1] - nz);
    uv.push(0, acc * uScale, 1, acc * uScale);
    if (i > 0) { const k = (i - 1) * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// Línea paralela a otra, a una distancia d (para colocar las orillas)
function offsetLine(pts, d) {
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dz = b[1] - a[1];
    const L = Math.hypot(dx, dz) || 1;
    dx /= L; dz /= L;
    return [p[0] - dz * d, p[1] + dx * d];
  });
}

// Riachuelo de jardín: lecho bajo el agua y orillas de piedra a ambos lados.
// Nace en la base de la cascada y entra en el estanque.
scene.add(new THREE.Mesh(uvMundo(ribbon(STREAM, 1.3, 1.3, 0.008, 0.3), 1.2), mGrava));

// Orillas: franja que va del agua a la hierba, con el borde exterior irregular. Usa la textura del suelo
// (con las mismas UV que el anillo del suelo) para que la luz la trate igual que el resto del prado.
const mVerge = new THREE.MeshStandardMaterial({ map: texGround, vertexColors: true, roughness: 1, side: THREE.DoubleSide });
function vergeGeo(pts, y) {
  const BANDAS = [HW + 0.02, HW + 0.3, HW + 0.8, HW + 1.6]; // de dentro hacia fuera
  const TONOS = [[0.62, 0.48, 0.36], [0.78, 0.72, 0.52], [0.92, 0.95, 0.86], [1, 1, 1]]; // tierra húmeda, después prado
  const pos = [], col = [], uv = [], idx = [];
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dz = b[1] - a[1];
    const L = Math.hypot(dx, dz) || 1;
    dx /= L; dz /= L;
    for (const lado of [-1, 1]) {
      for (let k = 0; k < BANDAS.length; k++) {
        const d = BANDAS[k] * (1 + 0.18 * k / 3 * Math.sin(i * 1.7 + lado * 2 + k * 0.9));
        const x = p[0] - dz * d * lado, z = p[1] + dx * d * lado;
        pos.push(x, y, z);
        uv.push(0.5 + x / 480, 0.5 - z / 480); // mismo mapeo que el suelo (anillo de 480 u)
        const v = 0.92 + 0.16 * Math.sin(i * 2.3 + k * 4.1 + lado);
        col.push(TONOS[k][0] * v, TONOS[k][1] * v, TONOS[k][2] * v);
      }
    }
  });
  const V = (i, lado, k) => i * 8 + (lado > 0 ? 4 : 0) + k;
  for (let i = 0; i < pts.length - 1; i++) {
    for (const lado of [-1, 1]) {
      for (let k = 0; k < BANDAS.length - 1; k++) {
        const a = V(i, lado, k), b = V(i, lado, k + 1), c = V(i + 1, lado, k), d = V(i + 1, lado, k + 1);
        idx.push(a, c, b, b, c, d);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  // Franja plana: normales hacia arriba fijas (el orden de los triángulos no afecta a la luz)
  g.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  return g;
}
scene.add(new THREE.Mesh(vergeGeo(STREAM, 0.012), mVerge));

// Cascada: el agua sale del borde de la roca, cae en una lámina con hilos que bajan
// y choca contra la base de piedra, donde salpica y hace espuma.
const rockParts = [
  [-3.2, 2.3, -37.9, 3.2, 2.3, 2.5], [3.2, 2.1, -37.9, 3.0, 2.1, 2.5], [0, 3.9, -37.8, 3.6, 1.3, 2.4],
  [0, 2.0, -37.6, 2.2, 1.8, 2.2], [-6.5, 1.2, -36.5, 2.2, 1.2, 1.6], [6.5, 1.1, -36.5, 2.2, 1.1, 1.6],
].map(([x, y, z, sx, sy, sz]) => new THREE.SphereGeometry(1, 14, 10).toNonIndexed().scale(sx, sy, sz).translate(x, y, z));
scene.add(new THREE.Mesh(mergeGeometries(rockParts), mRock));

const SHEET_Z = -35.25, LIP_Y = 4.8, BASE_Y = 0.5;
const sheetMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uBase: { value: new THREE.Color(0x1e4f57) },   // el mismo color del agua del estanque
    uLight: { value: new THREE.Color(0xdff4f8) },  // blanco azulado de la espuma y los hilos
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vec3 p = position;
      p.z += sin(uv.x * 22.0 + uv.y * 4.0) * 0.04 * uv.y; // la lámina ondula al caer
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uBase;
    uniform vec3 uLight;
    varying vec2 vUv;
    float hash(float n) { return fract(sin(n) * 43758.5453); }
    void main() {
      float col = floor(vUv.x * 40.0);
      float n = hash(col + 1.0);
      float sp = 0.8 + n * 1.2;
      // hilos de agua: bandas claras que bajan a distinta velocidad
      float ph = fract(vUv.y * (1.2 + n * 1.1) + n * 7.0 + uTime * sp * 0.6);
      float hilo = smoothstep(0.6, 1.0, ph);
      float borde = smoothstep(0.0, 0.08, vUv.x) * (1.0 - smoothstep(0.92, 1.0, vUv.x));
      float arriba = 1.0 - smoothstep(0.88, 1.0, vUv.y);
      float labio = smoothstep(0.95, 1.0, vUv.y);   // borde brillante donde sale el agua
      float pie = 1.0 - smoothstep(0.0, 0.2, vUv.y); // espuma donde choca
      float espuma = pie * (0.5 + 0.5 * hash(col * 3.0 + floor(uTime * 6.0)));
      vec3 c = mix(uBase, uLight, hilo * 0.45 + espuma * 0.9 + labio * 0.6);
      float a = borde * arriba * (0.6 + 0.3 * hilo) + borde * espuma * 0.5 + borde * labio * 0.5;
      gl_FragColor = vec4(c, clamp(a, 0.0, 0.92));
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
});
const sheet = new THREE.PlaneGeometry(3.2, LIP_Y - BASE_Y, 30, 40);
sheet.translate(0, (LIP_Y + BASE_Y) / 2, SHEET_Z);
scene.add(new THREE.Mesh(sheet, sheetMat));

// Río sobre la cima: una película de agua que corre hacia el borde y cae por la lámina
const filmMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uBase: { value: new THREE.Color(0x1e4f57) },
    uLight: { value: new THREE.Color(0xdff4f8) },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uBase;
    uniform vec3 uLight;
    varying vec2 vUv;
    float hash(float n) { return fract(sin(n) * 43758.5453); }
    void main() {
      // Hilos con ruido interpolado a lo ancho: sin columnas escalonadas
      float fx = vUv.x * 14.0, i0 = floor(fx), f = fract(fx);
      float n = mix(hash(i0 + 3.0), hash(i0 + 4.0), f * f * (3.0 - 2.0 * f));
      float ph = fract(-vUv.y * (1.0 + n * 0.6) + n * 5.0 + uTime * (0.8 + n) * 0.9); // corre hacia el borde
      float hilo = smoothstep(0.7, 1.0, ph);
      float borde = smoothstep(0.0, 0.1, vUv.x) * (1.0 - smoothstep(0.9, 1.0, vUv.x));
      vec3 c = mix(uBase, uLight, hilo * 0.4);
      gl_FragColor = vec4(c, borde * (0.4 + 0.25 * hilo));
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
});
// Río que llega a la cascada: baja desde el norte por un cauce de piedra, sobre una loma rocosa,
// y cae por el borde. Usa la misma corriente con hilos blancos que la lámina de la cascada.
const RIVER = [[-10.5, -100], [-9.5, -90], [-8.6, -80], [-8, -71], [-7.5, -63], [-6, -57], [-4.2, -51], [-2.8, -45], [-1.5, -40], [-0.5, -36], [0, -35.3]];
const riverPts = [];
for (let i = 0; i < RIVER.length - 1; i++) {
  for (let s = 0; s < 6; s++) {
    const t = s / 6, a = RIVER[i], b = RIVER[i + 1];
    riverPts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
  }
}
riverPts.push(RIVER[RIVER.length - 1]);
// Borde sur de la montaña: la cascada cae desde aquí
const CUMBRE_Z = -35.4;
// Altura de la cresta del río: sube hacia el norte desde el borde de la cascada
const ramp = (z) => 4.8 + Math.max(0, CUMBRE_Z - z) * 0.22;
// Distancia de un punto al cauce
const dRiver = (x, z) => {
  let m = 1e9;
  for (const p of riverPts) m = Math.min(m, Math.hypot(x - p[0], z - p[1]));
  return m;
};
// Semianchura de la ladera: se ensancha hacia el norte
const anchoLoma = (z) => 4 + Math.max(0, CUMBRE_Z - z) * 0.7;
// Altura de la montaña del norte: el cauce queda hundido en el centro y la ladera baja hacia los lados.
// Al sur acaba en el borde de la cascada, y al norte se apaga antes del horizonte.
const loma = (x, z) => {
  if (z > CUMBRE_Z) return 0;
  const d = dRiver(x, z);
  const W = anchoLoma(z);
  const laderaW = 1 - THREE.MathUtils.smoothstep(d, W * 0.45, W);
  const cauce = THREE.MathUtils.smoothstep(d, 1.0, 2.2);
  const ondas = 0.5 * Math.sin(x * 0.31 + z * 0.17) + 0.35 * Math.cos(x * 0.13 - z * 0.29 + 1.1);
  const fin = 1 - THREE.MathUtils.smoothstep(-z, 105, 125);
  return Math.max(0, fin * laderaW * (ramp(z) - 0.6 * (1 - cauce) + ondas * cauce));
};
// Un punto de la ladera del norte, lejos del cauce y de la cascada (para rocas, hierba y árboles)
function puntoEnMonte() {
  let p = null;
  for (let tries = 0; tries < 30; tries++) {
    const z = rnd(-120, CUMBRE_Z - 6), x = rnd(-anchoLoma(z), anchoLoma(z));
    p = { x, y: loma(x, z), z };
    if (p.y > 0.5 && dRiver(x, z) > 2.5) break;
  }
  return p;
}
// Cinta con altura por punto (para el agua del cauce, que baja por la loma)
function ribbon3(pts, w, uScale = 0.5) {
  const pos = [], uv = [], idx = [];
  let acc = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    if (i > 0) acc += Math.hypot(p[0] - pts[i - 1][0], p[2] - pts[i - 1][2]);
    let dx = b[0] - a[0], dz = b[2] - a[2];
    const L = Math.hypot(dx, dz) || 1;
    dx /= L; dz /= L;
    const nx = -dz * w / 2, nz = dx * w / 2;
    pos.push(p[0] + nx, p[1], p[2] + nz, p[0] - nx, p[1], p[2] - nz);
    uv.push(0, acc * uScale, 1, acc * uScale);
    if (i > 0) { const k = (i - 1) * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// La montaña del norte: malla con la altura de loma() y color por vértice (hierba abajo, roca arriba).
// Va con su propio material: mGranito lee el color por vértice y aquí habría salido negra.
const LOMA = new THREE.PlaneGeometry(170, 89.6, LOW ? 200 : 280, LOW ? 150 : 200) // malla fina: el cauce mide solo 2,2 u.rotateX(-Math.PI / 2).translate(0, 0, -80.2);
const lp = LOMA.attributes.position, lu = LOMA.attributes.uv;
const colores = new Float32Array(lp.count * 3);
const VERDE = new THREE.Color(0xd8e0a0), ROCA = new THREE.Color(0xb8b09c);
const c = new THREE.Color();
for (let i = 0; i < lp.count; i++) {
  const x = lp.getX(i), z = lp.getZ(i), h = loma(x, z);
  lp.setY(i, h - 0.03); // un pelo bajo el suelo: en el borde no parpadea con el anillo del suelo
  lu.setXY(i, 0.5 + x / 480, 0.5 - z / 480); // mismo mapeo que el suelo
  c.copy(VERDE).lerp(ROCA, THREE.MathUtils.smoothstep(h, 7, 13));
  colores.set([c.r, c.g, c.b], i * 3);
}
LOMA.setAttribute('color', new THREE.BufferAttribute(colores, 3));
LOMA.computeVertexNormals();
const mLoma = new THREE.MeshStandardMaterial({ map: texGround, vertexColors: true, roughness: 1 });
const lomaMesh = new THREE.Mesh(LOMA, mLoma);
lomaMesh.receiveShadow = true;
scene.add(lomaMesh);
scene.add(new THREE.Mesh(LOMA, mLoma));
// El agua del cauce, un poco por debajo de la orilla
scene.add(new THREE.Mesh(ribbon3(riverPts.map(([x, z]) => [x, ramp(z) - 0.2, z]), 2.4, 0.5), filmMat));
// Lecho de grava bajo la película: se ve a través del agua poco profunda

// Piedras del lecho: de distintos tipos y tamaños, en el riachuelo, alrededor de la poza y sobre la cima
const rockMats = [mCanto, mMusgo, mCaliza, mGranito];
const rockGeos = rocaGeos.flat(); // [tipo * variantes + variante]
const rockList = rockGeos.map(() => []);
const addRock = (x, z, s, mat, baseY = 0) => {
  const sq = rnd(0.5, 0.75);
  const variante = Math.floor(rnd(0, ROCA_VARIANTES));
  rockList[mat * ROCA_VARIANTES + variante].push({ x, y: baseY + s * sq * 0.25, z, s, sq, ry: rnd(0, Math.PI * 2) });
};
// Riachuelo: piedras pequeñas en el lecho y una grande cada cinco, en las orillas
for (let k = 0; k < 150; k++) {
  const i = Math.floor(rnd(0, STREAM.length - 1)), t = rnd(0, 1);
  const A = STREAM[i], B = STREAM[i + 1];
  const len = Math.hypot(B[0] - A[0], B[1] - A[1]);
  const nx = -(B[1] - A[1]) / len, nz = (B[0] - A[0]) / len; // perpendicular al riachuelo
  const cx = A[0] + (B[0] - A[0]) * t, cz = A[1] + (B[1] - A[1]) * t;
  const grande = k % 5 === 0;
  const lado = Math.random() < 0.5 ? -1 : 1;
  const off = grande ? lado * rnd(HW - 0.1, HW + 1.2) : rnd(-HW, HW);
  addRock(cx + nx * off, cz + nz * off, grande ? rnd(0.35, 0.65) : rnd(0.1, 0.22), Math.floor(rnd(0, rockMats.length)));
}
// Alrededor de la poza y al pie de la cascada
for (let k = 0; k < 28; k++) {
  const a = rnd(0, Math.PI * 2), r = rnd(3.4, 4.6);
  addRock(Math.cos(a) * r, -33.5 + Math.sin(a) * r, rnd(0.3, 0.6), Math.floor(rnd(0, rockMats.length)));

for (let k = 0; k < 8; k++) {
  addRock(rnd(-2.2, 2.2), rnd(-35.8, -34.6), rnd(0.25, 0.5), Math.floor(rnd(0, rockMats.length)));
}
// Piedras del cauce (dentro del agua y en las orillas) y sueltas por la loma
for (let k = 0; k < 170; k++) {

}
for (let k = 0; k < 140; k++) { // piedras sueltas por la ladera
  const p = puntoEnMonte();
  addRock(p.x, p.z, rnd(0.3, 0.6), Math.floor(rnd(0, rockMats.length)), p.y - 0.1);
}
rockList.forEach((lista, k) => {
  if (!lista.length) return;
  const im = new THREE.InstancedMesh(rockGeos[k], rockMats[Math.floor(k / ROCA_VARIANTES)], lista.length);
  lista.forEach((R, i) => {
    dummy.position.set(R.x, R.y, R.z);
    dummy.rotation.set(0, R.ry, 0);
    dummy.scale.set(R.s, R.s * R.sq, R.s * rnd(0.8, 1.2));
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);

// Hierba y árboles de la montaña del norte, sobre el terreno

for (let i = 0; i < grassMonte.count; i++) {
  const p = puntoEnMonte();

  dummy.updateMatrix();

}

scene.add(grassMonte);
for (const variante of FOREST_VARIANTS) {

// Fuentes: piletas de piedra. El tubo de madera llega a la columna y el agua sale por la boquilla de arriba.

// Tubos de madera elevados desde el riachuelo hasta cada fuente (nunca pasan por el suelo)
function pipe(ax, az, bx, bz, y) {
  const len = Math.hypot(bx - ax, bz - az);
  const g = new THREE.CylinderGeometry(0.09, 0.09, len, 10, 1).toNonIndexed();
  g.rotateZ(Math.PI / 2);
  g.rotateY(Math.atan2(-(bz - az), bx - ax));
  g.translate((ax + bx) / 2, y, (az + bz) / 2);
  return g;
}
function post(x, z, h) {
  return new THREE.BoxGeometry(0.16, h, 0.16).toNonIndexed().translate(x, h / 2, z);
}
// Cada tubo llega al centro de la columna de su fuente, y de ahí sube el agua hasta la boquilla.
const PIPES = [
  { a: [-4.1, -19.9], b: [-9, -21], y: 1.1 },
  { a: [-3.3, -25.0], b: [7, -24], y: 1.1 },
];
const pipeParts = [];
for (const P of PIPES) {
  const [ax, az] = P.a, [bx, bz] = P.b;
  pipeParts.push(pipe(ax, az, bx, bz, P.y));
  pipeParts.push(post(ax, az, P.y), post((ax + bx) / 2, (az + bz) / 2, P.y));
}
scene.add(new THREE.Mesh(mergeGeometries(pipeParts), mWood));

// Chorros, gotas y salpicaduras: cada gota sigue una trayectoria de proyectil, con gravedad.
// Salen de la boquilla de cada fuente y caen a la pileta. En la cascada, el agua cae por el borde
// de la roca y salpica al chocar con la base. Cada gota dura lo que tarda en tocar el agua.
const G_ACC = 9.8;
const jets = [];
const addDrop = (ox, oy, oz, vx, vy, vz, sueloY) => {
  const L = (vy + Math.sqrt(vy * vy + 2 * G_ACC * (oy - sueloY))) / G_ACC; // tiempo hasta caer al agua
  jets.push({ ox, oy, oz, vx, vy, vz, L, age: Math.random() * L });
};
for (const F of VFOUNT) {
  for (let i = 0; i < 180; i++) {  // chorros en arco, que se abren desde la boquilla
    const a = rnd(0, Math.PI * 2), sp = rnd(0.35, 1.2);
    addDrop(F.x, F.nozzleY, F.z, Math.cos(a) * sp, rnd(2.4, 3.1), Math.sin(a) * sp, F.basinY);
  }
  for (let i = 0; i < 70; i++) {  // hilo central, casi vertical
    const a = rnd(0, Math.PI * 2), sp = rnd(0.04, 0.18);
    addDrop(F.x, F.nozzleY, F.z, Math.cos(a) * sp, rnd(2.9, 3.4), Math.sin(a) * sp, F.basinY);
  }
}
for (let i = 0; i < 120; i++) { // agua que cae por el borde de la roca
  addDrop(rnd(-1.5, 1.5), LIP_Y, SHEET_Z - 0.05, 0, 0, 0, 0.05);
}
for (let i = 0; i < 110; i++) { // salpicaduras al chocar con la base
  addDrop(rnd(-1.4, 1.4), rnd(0.5, 0.9), SHEET_Z + rnd(-0.1, 0.25), rnd(-0.6, 0.6), rnd(1.2, 2.6), rnd(0.5, 1.6), 0.05);
}
const dropPos = new Float32Array(jets.length * 3);
const dropGeo = new THREE.BufferGeometry();
dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
// Gotas redondas: una textura con un círculo suave (sin cuadrados)
const dropCanvas = document.createElement('canvas');
dropCanvas.width = dropCanvas.height = 32;
const dg = dropCanvas.getContext('2d');
const dgr = dg.createRadialGradient(16, 16, 0, 16, 16, 16);
dgr.addColorStop(0, 'rgba(255,255,255,1)');
dgr.addColorStop(0.55, 'rgba(255,255,255,0.9)');
dgr.addColorStop(1, 'rgba(255,255,255,0)');
dg.fillStyle = dgr;
dg.fillRect(0, 0, 32, 32);
const drops = new THREE.Points(dropGeo, new THREE.PointsMaterial({
  color: 0xf2faff, map: new THREE.CanvasTexture(dropCanvas), size: 0.1,
  transparent: true, opacity: 0.9, depthWrite: false,
}));
drops.frustumCulled = false;
scene.add(drops);

// Plazas y caminos de piedra (ninguna acequia ni agua pasa por ellos)

  new THREE.CircleGeometry(4.5, 40).rotateX(-Math.PI / 2).translate(-9, 0.012, -21).toNonIndexed(),
  new THREE.CircleGeometry(3, 40).rotateX(-Math.PI / 2).translate(7, 0.012, -24).toNonIndexed(),
  ribbon([[-18, -15], [-14, -17], [-9.5, -18.5], [-9, -21]], 1.0, 1.0, 0.014, 0.5).toNonIndexed(),

// Puente de tablas sobre el riachuelo

  new THREE.BoxGeometry(3.2, 0.06, 0.08).translate(-3.6, 0.55, -21.4),
  new THREE.BoxGeometry(0.08, 0.55, 0.08).translate(-5.2, 0.3, -22.6),
  new THREE.BoxGeometry(0.08, 0.55, 0.08).translate(-5.2, 0.3, -21.4),

// Casas: [x, z, giro, ancho, fondo, alto]. Se unen en pocas mallas para que el móvil vaya fluido.
const HOUSES = [
  [-17, -13, 0.15, 3.4, 2.8, 2.5], [-21, -20, -0.1, 3.0, 2.6, 2.4], [-16, -27, 0.3, 3.6, 3.0, 2.6],
  [-22, -30, -0.05, 3.0, 2.6, 2.3], [-9, -31, 0.05, 3.0, 2.6, 2.4], [-12, -15.5, -0.2, 2.8, 2.4, 2.3],
  [13, -14, -0.1, 3.2, 2.6, 2.5], [19, -20, 0.2, 3.0, 2.6, 2.4], [15, -31, -0.3, 3.4, 2.8, 2.6],
  [22, -28, 0.1, 2.8, 2.4, 2.2], [6, -33, 0.2, 3.0, 2.6, 2.3],
];
const hWalls = [], hRoofs = [], hPaper = [], hDoor = [], hWin = [];
for (const [x, z, ry, w, d, h] of HOUSES) {
  const at = (g) => (g.index ? g.toNonIndexed() : g).rotateY(ry).translate(x, 0.02, z);
  hWalls.push(at(new THREE.BoxGeometry(w, h, d).translate(0, h / 2, 0)));
  hPaper.push(at(new THREE.BoxGeometry(w * 0.7, h * 0.5, 0.06).translate(0, h * 0.55, d / 2 + 0.03)));
  hDoor.push(at(new THREE.BoxGeometry(w * 0.2, h * 0.55, 0.08).translate(-w * 0.22, h * 0.28, d / 2 + 0.04)));
  hWin.push(at(new THREE.BoxGeometry(w * 0.16, h * 0.22, 0.08).translate(w * 0.26, h * 0.6, d / 2 + 0.04)));
  // Tejado a dos aguas: un triángulo extruido a lo ancho de la casa
  const rh = 1.0 + d * 0.22, o = 0.35;
  const sh = new THREE.Shape();
  sh.moveTo(-d / 2 - o, h - 0.02);
  sh.lineTo(d / 2 + o, h - 0.02);
  sh.lineTo(0, h + rh);
  sh.closePath();
  const roof = new THREE.ExtrudeGeometry(sh, { depth: w + 0.5, bevelEnabled: false });
  roof.translate(0, 0, -(w + 0.5) / 2).rotateY(Math.PI / 2);
  hRoofs.push(at(roof));
  SOLIDS.push({ x, z, r: Math.max(w, d) / 2 + 0.25 });
}
scene.add(new THREE.Mesh(mergeGeometries(hWalls), mWood));
scene.add(new THREE.Mesh(mergeGeometries(hRoofs), mRoof));
scene.add(new THREE.Mesh(mergeGeometries(hPaper), mPaper));
scene.add(new THREE.Mesh(mergeGeometries(hDoor), mDoor));
scene.add(new THREE.Mesh(mergeGeometries(hWin), mWin));

// Árboles del pueblo (con tronco y ramas; la cámara no los atraviesa)
const VTREES = [[-6, -16], [-26, -18], [10, -28.5], [25, -15], [-15, -35]];
instanceTrees(HERO_VARIANTS[2], VTREES.length, (i) => ({ x: VTREES[i][0], z: VTREES[i][1], s: 1.05 }), false, 2.6);

// Animación del pueblo: las ondas corren, caen las gotas de las fuentes y las ventanas se encienden al anochecer
function updateVillage(dt, t) {
  sheetMat.uniforms.uTime.value = t;
  filmMat.uniforms.uTime.value = t;
  for (let i = 0; i < jets.length; i++) {
    const d = jets[i];
    d.age = (d.age + dt) % d.L;
    dropPos[i * 3] = d.ox + d.vx * d.age;
    dropPos[i * 3 + 1] = d.oy + d.vy * d.age - 0.5 * G_ACC * d.age * d.age;
    dropPos[i * 3 + 2] = d.oz + d.vz * d.age;
  }
  dropGeo.attributes.position.needsUpdate = true;
  const night = THREE.MathUtils.clamp((6 - sun.position.y) / 8, 0, 1);
  mWin.emissiveIntensity = 0.2 + night * 1.4;
}

// Tres posiciones: [posición] y [punto al que mira]
const VIEWS = [
  { pos: [0, 4.2, 18],   look: [0, 0.2, 0] },  // desde la orilla sur, mirando el estanque
  { pos: [-14, 4.5, -6],   look: [0, 0.6, 0] },   // alta, desde la orilla oeste
  { pos: [16, 4.2, 6], look: [6, 1.2, -3] },  // desde el este, mirando la casa de té
  { pos: [-14, 7, -4], look: [-12, 0.8, -22] }, // desde lo alto del noroeste, sobre los arbustos, mirando el pueblo
];
let viewIdx = 0;
const camPos = new THREE.Vector3();
let yaw = 0, pitch = 0;

function setView(i) {
  viewIdx = i;
  const v = VIEWS[i];
  camPos.set(...v.pos);
  const dx = v.look[0] - v.pos[0], dy = v.look[1] - v.pos[1], dz = v.look[2] - v.pos[2];
  yaw = Math.atan2(-dx, -dz);
  pitch = Math.atan2(dy, Math.hypot(dx, dz));
  if (bokeh) bokeh.uniforms['focus'].value = Math.hypot(dx, dy, dz); // enfoca lo que miras
}

// Teclado
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); // que la página no se desplace
  if (e.code.startsWith('Digit') && TIMES[e.code.slice(5)]) setTime(Number(e.code.slice(5)));
  if (e.code === 'KeyC') setView((viewIdx + 1) % VIEWS.length);
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// Arrastrar para mirar (ratón o un dedo)
const canvas = renderer.domElement;
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointercancel', () => { dragging = false; });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw += (e.clientX - lastX) * 0.004;
  pitch = THREE.MathUtils.clamp(pitch + (e.clientY - lastY) * 0.003, -1.2, 1.2);
  lastX = e.clientX;
  lastY = e.clientY;
});

// Botones de la pantalla
document.querySelectorAll('[data-time]').forEach((b) =>
  b.addEventListener('click', () => setTime(Number(b.dataset.time))));
document.querySelectorAll('[data-cam]').forEach((b) =>
  b.addEventListener('click', () => setView((viewIdx + 1) % VIEWS.length)));
document.querySelectorAll('[data-key]').forEach((b) => {
  const code = b.dataset.key;
  const set = (v) => () => { keys[code] = v; };
  b.addEventListener('pointerdown', set(true));
  b.addEventListener('pointerup', set(false));
  b.addEventListener('pointerleave', set(false));
  b.addEventListener('pointercancel', set(false));
});

function updateMovement(dt) {
  const sp = 4 * dt;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);   // hacia donde miras
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);    // hacia la derecha
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) { mx += fx; mz += fz; }
  if (keys.KeyS || keys.ArrowDown) { mx -= fx; mz -= fz; }
  if (keys.KeyD || keys.ArrowRight) { mx += rx; mz += rz; }
  if (keys.KeyA || keys.ArrowLeft) { mx -= rx; mz -= rz; }
  camPos.x += mx * sp;
  camPos.z += mz * sp;

  // Subir y bajar: Espacio o ↑ sube, Mayús o ↓ baja. La altura va de 0.6 a 12.
  let vy = 0;
  if (keys.Space) vy += 1;
  if (keys.ShiftLeft || keys.ShiftRight) vy -= 1;
  camPos.y = THREE.MathUtils.clamp(camPos.y + vy * sp, 0.6, 12);

  // No entrar en el agua: el radio se mantiene entre 5.2 y 20, y hasta 40 dentro del pueblo (al norte).
  const r = Math.hypot(camPos.x, camPos.z) || 0.001;
  const enPueblo = camPos.z < -11 && Math.abs(camPos.x) < 28;
  const rc = THREE.MathUtils.clamp(r, 5.2, enPueblo ? 40 : 20);
  camPos.x *= rc / r;
  camPos.z *= rc / r;

  // No atravesar árboles, arbustos ni la casa de té mientras la cámara está baja.
  if (camPos.y < 5.5) {
    for (const s of SOLIDS) {
      const ex = camPos.x - s.x, ez = camPos.z - s.z;
      const d = Math.hypot(ex, ez);
      if (d < s.r && d > 0.0001) {
        camPos.x = s.x + (ex / d) * s.r;
        camPos.z = s.z + (ez / d) * s.r;
      }
    }
  }

  camera.position.copy(camPos);
  camera.rotation.set(pitch, yaw, 0);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(window.innerWidth, window.innerHeight);
}
addEventListener('resize', onResize);

/* =========================================================
   14. BUCLE DE ANIMACIÓN
   ========================================================= */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  updateMovement(dt);
  updateKoi(t);
  updateLeaves(dt, t);
  updateVillage(dt, t);
  if (water.material.uniforms.time) water.material.uniforms.time.value += dt;
  if (water.material.uniforms.eye) water.material.uniforms.eye.value.copy(camera.position);
  if (waterV.material.uniforms.time) waterV.material.uniforms.time.value += dt;
  if (waterV.material.uniforms.eye) waterV.material.uniforms.eye.value.copy(camera.position);
  composer.render();
});

// Estado inicial: tarde, cámara baja junto a la orilla
onResize();
setTime(2);
setView(0);
</script>
